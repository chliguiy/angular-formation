<div class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white shadow-sm">
    <div
      class="mx-auto flex max-w-6xl flex-col gap-4 px-6 py-4
             sm:flex-row sm:items-center sm:justify-between"
    >
      <a
        routerLink="/"
        class="text-xl font-bold text-blue-700"
       i18n="@@nav.title">
        Mon application
      </a>

      <nav class="flex items-center gap-2">
        @if (auth.aRole('admin')) {
        <a
          routerLink="/home"
          routerLinkActive="bg-blue-50 text-blue-700"
          class="rounded-lg px-4 py-2 font-medium text-slate-600
                 transition-colors hover:bg-blue-50 hover:text-blue-700"
         i18n="@@nav.home">
          Accueil
        </a>
        }

        @if (auth.connecte()) {
        <a
          routerLink="/products"
          routerLinkActive="bg-blue-50 text-blue-700"
          class="rounded-lg px-4 py-2 font-medium text-slate-600
                 transition-colors hover:bg-blue-50 hover:text-blue-700"
                  i18n="@@nav.products">
          Produits
        </a>
        }

        <a
          routerLink="/films"
          routerLinkActive="bg-blue-50 text-blue-700"
          class="rounded-lg px-4 py-2 font-medium text-slate-600
                 transition-colors hover:bg-blue-50 hover:text-blue-700"
         i18n="@@nav.films">
          Films
        </a>

        @if (auth.user(); as user) {
          <span class="ml-2 text-sm text-slate-500">{{ user.name }}</span>
          <button
            type="button"
            (click)="deconnexion()"
            class="rounded-lg px-4 py-2 font-medium text-slate-600 hover:bg-blue-50"
           i18n="@@nav.logout">
            Déconnexion
          </button>
        } @else {
          <a
            routerLink="/connexion"
            class="rounded-lg px-4 py-2 font-medium text-slate-600 hover:bg-blue-50"
           i18n="@@nav.login">
            Connexion
          </a>
        }


        <a
          [href]="'/' + autreLocale + '/'"
          class="ml-2 rounded-lg border border-slate-200 px-2 py-1 text-sm uppercase text-slate-600"
        >
          {{ autreLocale }}
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-10">
    <router-outlet />
  </main>
</div>
