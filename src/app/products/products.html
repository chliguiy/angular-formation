<div class="rounded-xl bg-white p-6 shadow-sm">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-800">Products</h2>
    <p class="mt-1 text-sm text-slate-500">
      Liste des produits disponibles
    </p>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-100 text-xs uppercase text-slate-600">
        <tr>
          <th scope="col" class="rounded-tl-lg px-4 py-3">Name</th>
          <th scope="col" class="px-4 py-3">Description</th>
          <th scope="col" class="rounded-tr-lg px-4 py-3">Selected</th>
        </tr>
      </thead>

   <tbody class="divide-y divide-slate-100">
  @for (product of products; track product.id) {
    <tr class="hover:bg-slate-50">
      <td class="px-4 py-4 font-medium">
        {{ product.name }}
      </td>

      <td class="px-4 py-4">
        {{ product.description }}
      </td>

      <td class="px-4 py-4">
        <button
          type="button"
          (click)="toggleSelected(product)"
          [class]="product.selected
            ? 'rounded-full bg-green-100 px-3 py-1 text-sm font-medium text-green-700'
            : 'rounded-full bg-slate-100 px-3 py-1 text-sm font-medium text-slate-600'"
        >
          {{ product.selected ? 'Sélectionné' : 'Non sélectionné' }}
        </button>
      </td>
    </tr>
  }
</tbody>
    </table>
  </div>
</div>
