<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
  <h2 class="mb-6 text-2xl font-bold text-slate-800">Ajouter un film</h2>

  <app-dynamic-form [fields]="fields" submitLabel="Ajouter un film" (submitted)="submit($event)">
    <a routerLink="/films" class="rounded-lg px-4 py-2 text-sm text-slate-600 hover:bg-slate-100">
      Annuler
    </a>
  </app-dynamic-form>
</div>
