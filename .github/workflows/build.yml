name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production (SSR)
        run: npx ng build --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
